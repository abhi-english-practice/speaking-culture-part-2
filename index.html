:root{--ink:#202928;--paper:#fffdf3;--red:#973b46;--lime:#d5ff36}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--ink);font-family:Arial,sans-serif;background-image:radial-gradient(#ffffff09 1px,transparent 1px);background-size:26px 26px}header{max-width:1240px;margin:auto;padding:32px 22px 24px;color:var(--paper)}h1{font-size:38px;margin:0 0 9px;letter-spacing:-1px}header p{margin:0;color:#c5cecd}nav{background:var(--paper);border-block:2px solid #151b19;padding:14px max(18px,calc((100% - 1196px)/2));display:flex;gap:12px;flex-wrap:wrap}button,select{font:inherit;color:inherit;border:2px solid var(--ink);background:#faf8ed;padding:11px 14px;cursor:pointer;border-radius:0}button{box-shadow:3px 3px 0 #171c18}button:active{transform:translate(2px,2px);box-shadow:1px 1px 0}button:focus-visible,select:focus-visible,.phrase:focus-visible{outline:3px solid #a36c09;outline-offset:4px}.active{background:var(--lime)}main{max-width:1240px;margin:22px auto;padding:0 22px}.player,.card{background:var(--paper);border:2px solid #141c18;box-shadow:4px 4px 0 #121914}.player{display:flex;gap:14px;align-items:center;padding:15px;margin-bottom:24px;flex-wrap:wrap}audio{flex:1;min-width:240px;height:44px}.speed{display:flex;align-items:center;gap:8px}.card{padding:26px;margin-bottom:28px}.topline{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}h2{font-size:28px;margin:0;letter-spacing:-.5px}.badge{font-size:13px;background:#f8edce;border-radius:20px;padding:9px 12px}.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:22px 0}.tools button{font-size:15px;padding:8px 12px}.tools span{font-size:14px;color:#5a6870}.en{font-family:Georgia,'Times New Roman',serif;font-size:24px;line-height:1.85;text-align:justify;margin:20px 0}.vi{font-size:19px;line-height:1.75;color:#795238;border-left:3px solid #dbc49a;padding:0 0 0 16px;margin-top:-7px}.vi[hidden]{display:none}.phrase{color:var(--red);font-weight:bold;cursor:po </style></head><body><header><h1>Cultural Diversity</h1><p>Read closely. Listen. Explore different perspectives.</p></header><nav aria-label="Reading controls"><button class="active" id="home">Home</button><button id="vi" aria-pressed="false">VI OFF</button><button id="keys" aria-pressed="true">Key phrases ON</button><button id="reset">Reset All</button></nav><main><section class="player" aria-label="Audio player"><audio id="audio" controls preload="metadata" src="./audio.mp3"></audio><button id="stop">Stop</button><label class="speed">Speed <select id="speed"><option>.75</option><option selected>1</option><option>1.25</option><option>1.5</option></select></label></section><div id="readings"></div></main><footer>Designed by Abhi-Uyen</footer><aside class="note" id="note" hidden><span></span><button aria-label="Close meaning">×</button></aside><script>
const lessons=[{"title": "A trip to Thailand", "start": 0, "end": 115.28, "paras": [{"sentences": [{"text": "I’d like to talk about a time when I came into contact with a different culture.", "start": 0.0, "end": 4.64}], "vi": "Tôi muốn kể về một lần tôi tiếp xúc với một nền văn hóa khác."}, {"sentences": [{"text": "It happened about two years ago, when I travelled to Thailand with some friends.", "start": 5.56, "end": 9.62}], "vi": "Chuyện xảy ra khoảng hai năm trước, khi tôi đi du lịch Thái Lan cùng vài người bạn."}, {"sentences": [{"text": "At first, I was really excited.", "start": 10.78, "end": 12.82}, {"text": "It was my first time visiting another country, so everything felt new and interesting.", "start": 13.6, "end": 18.74}], "vi": "Ban đầu, tôi thực sự hào hứng. Đó là lần đầu tiên tôi đến một quốc gia khác, nên mọi thứ đều mới mẻ và thú vị."}, {"sentences": [{"text": "But... after a while, I also experienced a little culture shock.", "start": 20.04, "end": 24.22}], "vi": "Nhưng... sau một thời gian, tôi cũng trải qua một chút sốc văn hóa."}, {"sentences": [{"text": "The food was different, the language was unfamiliar, and some of the local customs were quite different from what I was used to.", "start": 24.96, "end": 32.08}], "vi": "Đồ ăn khác lạ, ngôn ngữ xa lạ và một số phong tục địa phương khá khác với những gì tôi quen thuộc."}, {"sentences": [{"text": "Sometimes, I even became disoriented... because I didn’t know exactly how I was supposed to behave in certain situations.", "start": 33.08, "end": 39.48}], "vi": "Đôi lúc, tôi thậm chí cảm thấy bối rối... vì không biết chính xác mình nên cư xử thế nào trong một số tình huống."}, {"sentences": [{"text": "I remember thinking, “Am I doing the right thing?”", "start": 40.86, "end": 43.74}], "vi": "Tôi nhớ mình đã nghĩ: “Mình có đang làm đúng không?”"}, {"sentences": [{"text": "Fortunately, as the trip went on, things became much easier.", "start": 45.04, "end": 48.52}], "vi": "May mắn là khi chuyến đi tiếp diễn, mọi thứ trở nên dễ dàng hơn nhiều."}, {"sentences": [{"text": "I met several local people, as well as tourists from other countries, and talking to them helped me understand different perspectives.", "start": 49.46, "end": 56.1}], "vi": "Tôi gặp một số người dân địa phương, cũng như du khách từ các nước khác, và việc trò chuyện với họ giúp tôi hiểu những góc nhìn khác nhau."}, {"sentences": [{"text": "I gradually realised that every country has its own ways of being.", "start": 57.18, "end": 61.52}], "vi": "Tôi dần nhận ra rằng mỗi quốc gia đều có những cách sống riêng."}, {"sentences": [{"text": "And because of that, we really shouldn’t use our own culture as the standard when we look at other people.", "start": 62.28, "end": 67.3}], "vi": "Vì vậy, chúng ta thực sự không nên lấy văn hóa của mình làm chuẩn mực khi nhìn nhận người khác."}, {"sentences": [{"text": "That was probably the most important lesson I learned from the experience.", "start": 68.24, "end": 72.24}], "vi": "Đó có lẽ là bài học quan trọng nhất tôi rút ra từ trải nghiệm này."}, {"sentences": [{"text": "It taught me to recognize and respect cultural differences.", "start": 73.06, "end": 76.5}], "vi": "Trải nghiệm ấy dạy tôi nhận biết và tôn trọng những khác biệt văn hóa."}, {"sentences": [{"text": "I also realised that cultural diversity is actually a very positive thing.", "start": 77.88, "end": 82.38}], "vi": "Tôi cũng nhận ra rằng sự đa dạng văn hóa thực sự là một điều rất tích cực."}, {"sentences": [{"text": "People from different backgrounds can share their ideas, traditions, experiences... and different ways of looking at life.", "start": 83.1, "end": 90.6}], "vi": "Những người có xuất thân khác nhau có thể chia sẻ ý tưởng, truyền thống, trải nghiệm... và những cách nhìn nhận cuộc sống khác nhau."}, {"sentences": [{"text": "Looking back, the trip was much more than just a holiday.", "start": 91.86, "end": 94.92}], "vi": "Nhìn lại, chuyến đi ấy có ý nghĩa hơn nhiều so với một kỳ nghỉ thông thường."}, {"sentences": [{"text": "It made me more open-minded, and much more comfortable when communicating across cultures.", "start": 95.72, "end": 103.64}], "vi": "Nó giúp tôi cởi mở hơn và thoải mái hơn nhiều khi giao tiếp giữa các nền văn hóa."}, {"sentences": [{"text": "And even now, when I think about Thailand, I still remember that feeling of discovering a completely different way of life.", "start": 104.56, "end": 114.64}], "vi": "Ngay cả bây giờ, khi nghĩ về Thái Lan, tôi vẫn nhớ cảm giác khám phá một lối sống hoàn toàn khác."}]}, {"title": "My first trip to India", "start": 115.28, "end": 231.92000000000002, "paras": [{"sentences": [{"text": "I’d like to talk about my first trip to India... which was also the first time I had really come into contact with a culture that was very different from my own.", "start": 115.28, "end": 125.08}], "vi": "Tôi muốn kể về chuyến đi đầu tiên đến Ấn Độ... cũng là lần đầu tiên tôi thực sự tiếp xúc với một nền văn hóa rất khác với văn hóa của mình."}, {"sentences": [{"text": "I went there about two years ago with two of my close friends.", "start": 126.3, "end": 130.38}, {"text": "We visited New Delhi and Jaipur, and I still remember how excited I felt from the moment we arrived.", "start": 130.8, "end": 137.76}], "vi": "Tôi đến đó khoảng hai năm trước cùng hai người bạn thân. Chúng tôi đến New Delhi và Jaipur, và tôi vẫn nhớ cảm giác hào hứng ngay từ lúc đặt chân tới."}, {"sentences": [{"text": "Everything seemed so colourful... so lively... and completely new to me.", "start": 138.68, "end": 143.92}], "vi": "Mọi thứ dường như thật rực rỡ... thật sống động... và hoàn toàn mới mẻ với tôi."}, {"sentences": [{"text": "However, I also experienced some culture shock because many things were different from what I was used to.", "start": 144.88, "end": 150.9}], "vi": "Tuy nhiên, tôi cũng trải qua một chút sốc văn hóa vì nhiều thứ khác với những gì tôi quen thuộc."}, {"sentences": [{"text": "The streets were extremely busy, the food was much spicier than I expected, and people had different customs, especially when greeting others or eating together.", "start": 151.56, "end": 161.72}], "vi": "Đường phố vô cùng đông đúc, đồ ăn cay hơn nhiều so với tôi tưởng, và mọi người có những phong tục khác, đặc biệt khi chào hỏi hoặc ăn cùng nhau."}, {"sentences": [{"text": "During the first few days, I sometimes became disoriented because everything seemed unfamiliar.", "start": 162.8, "end": 168.22}], "vi": "Trong vài ngày đầu, đôi lúc tôi cảm thấy bối rối vì mọi thứ đều xa lạ."}, {"sentences": [{"text": "I remember entering a temple and wondering...", "start": 168.22, "end": 171.22}, {"text": "“Am I behaving in the right way?”", "start": 171.76, "end": 173.42}], "vi": "Tôi nhớ lúc bước vào một ngôi đền và tự hỏi... “Mình có đang cư xử đúng cách không?”"}, {"sentences": [{"text": "I wasn’t always sure what I should do or how I should communicate with local people.", "start": 174.26, "end": 178.4}], "vi": "Tôi không phải lúc nào cũng biết chắc mình nên làm gì hoặc nên giao tiếp với người dân địa phương như thế nào."}, {"sentences": [{"text": "Fortunately, the people we met were very friendly and willing to help us... and that made me feel much more comfortable.", "start": 179.38, "end": 185.84}], "vi": "May mắn là những người chúng tôi gặp rất thân thiện và sẵn lòng giúp đỡ... điều đó khiến tôi cảm thấy thoải mái hơn nhiều."}, {"sentences": [{"text": "As I spent more time there, I started to understand different perspectives.", "start": 186.7, "end": 190.7}], "vi": "Khi ở đó lâu hơn, tôi bắt đầu hiểu những góc nhìn khác nhau."}, {"sentences": [{"text": "I realised that every society has its own ways of being... so we shouldn’t use our own culture as the standard when judging other people.", "start": 191.62, "end": 199.54}], "vi": "Tôi nhận ra rằng mỗi xã hội đều có những cách sống riêng... nên chúng ta không nên lấy văn hóa của mình làm chuẩn mực khi đánh giá người khác."}, {"sentences": [{"text": "What I learned most from the trip was to recognize and respect cultural differences.", "start": 200.66, "end": 205.02}], "vi": "Bài học lớn nhất tôi rút ra từ chuyến đi là nhận biết và tôn trọng những khác biệt văn hóa."}, {"sentences": [{"text": "India showed me just how interesting cultural diversity can be... from food and colourful clothing to religion, traditions and everyday life.", "start": 206.0, "end": 215.12}], "vi": "Ấn Độ cho tôi thấy sự đa dạng văn hóa thú vị đến nhường nào... từ ẩm thực và trang phục rực rỡ đến tôn giáo, truyền thống và cuộc sống hằng ngày."}, {"sentences": [{"text": "Looking back, my first trip to India made me much more open-minded... and more confident when communicating across cultures.", "start": 215.88, "end": 223.5}], "vi": "Nhìn lại, chuyến đi đầu tiên đến Ấn Độ khiến tôi cởi mở hơn nhiều... và tự tin hơn khi giao tiếp giữa các nền văn hóa."}, {"sentences": [{"text": "It was definitely one of the most memorable travel experiences I’ve ever had.", "start": 223.5, "end": 231.32}], "vi": "Đó chắc chắn là một trong những trải nghiệm du lịch đáng nhớ nhất tôi từng có."}]}],phrases={"came into contact with": "tiếp xúc với", "come into contact with": "tiếp xúc với", "culture shock": "sốc văn hóa", "local customs": "phong tục địa phương", "became disoriented": "trở nên bối rối, mất phương hướng", "different perspectives": "những góc nhìn khác nhau", "ways of being": "những cách sống và thể hiện bản thân", "as the standard": "làm chuẩn mực", "cultural differences": "những khác biệt văn hóa", "cultural diversity": "sự đa dạng văn hóa", "different backgrounds": "những xuất thân khác nhau", "open-minded": "cởi mở", "communicating across cultures": "giao tiếp giữa các nền văn hóa", "way of life": "lối sống", "willing to help": "sẵn lòng giúp đỡ", "memorable travel experiences": "những trải nghiệm du lịch đáng nhớ", "Looking back": "nhìn lại", "as well as": "cũng như", "from what I was used to": "so với những gì tôi quen thuộc"};
const audio=document.getElementById('audio'),reading=document.getElementById('readings');let vi=false,keys=true,limit=null,marks=[],undo=[],selected=null;const timeline=[];
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function decorate(s){const p=Object.keys(phrases).sort((a,b)=>b.length-a.length);const re=new RegExp(p.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'gi');let last=0,result='';for(const m of s.matchAll(re)){const key=p.find(x=>x.toLowerCase()===m[0].toLowerCase());result+=esc(s.slice(last,m.index))+'<span class="phrase" role="button" tabindex="0" data-key="'+esc(key)+'">'+esc(m[0])+'</span>';last=m.index+m[0].length;}return result+esc(s.slice(last));}
lessons.forEach((lesson,li)=>{const card=document.createElement('article');card.className='card';card.innerHTML='<div class="topline"><h2>'+lesson.title+'</h2><span class="badge">'+lesson.paras.length+' paragraphs</span><button class="listen">▶ Listen to passage</button></div><div class="tools"><span>Select text:</span>'+['Yellow','Green','Pink','Erase','Undo','Clear colours'].map(x=>'<button data-action="'+x+'">'+x+'</button>').join('')+'</div>';lesson.paras.forEach(p=>{const en=document.createElement('p');en.className='en';p.sentences.forEach((s,i)=>{if(i)en.append(' ');const span=document.createElement('span');span.className='sentence';span.innerHTML=decorate(s.text);en.append(span);timeline.push({...s,el:span});});card.append(en);const v=document.createElement('p');v.className='vi';v.hidden=true;v.textContent=p.vi;card.append(v);});card.querySelector('.listen').onclick=()=>{audio.pause();limit=lesson.end;audio.currentTime=lesson.start;audio.play().catch(()=>{});};reading.append(card);});
function stop(){audio.pause();limit=null;audio.currentTime=0;update();for(const s of timeline)s.el.classList.remove('speaking');}function update(){if(limit!==null&&audio.currentTime>=limit){audio.pause();limit=null;}for(const s of timeline)s.el.classList.toggle('speaking',!audio.ended&&audio.currentTime>0&&audio.currentTime>=s.start&&audio.currentTime<s.end);}audio.addEventListener('timeupdate',update);audio.addEventListener('seeked',update);audio.addEventListener('ended',()=>{limit=null;update()});audio.addEventListener('seeking',()=>{if(limit!==null&&!lessons.some(l=>l.end===limit&&audio.currentTime>=l.start&&audio.currentTime<=l.end))limit=null});document.getElementById('stop').onclick=stop;document.getElementById('speed').onchange=e=>audio.playbackRate=Number(e.target.value);document.getElementById('home').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
function setVI(){document.querySelectorAll('.vi').forEach(x=>x.hidden=!vi);document.getElementById('vi').textContent='VI '+(vi?'ON':'OFF');document.getElementById('vi').setAttribute('aria-pressed',vi);}document.getElementById('vi').onclick=()=>{vi=!vi;setVI()};function setKeys(){reading.classList.toggle('no-phrases',!keys);document.getElementById('keys').textContent='Key phrases '+(keys?'ON':'OFF');document.getElementById('keys').setAttribute('aria-pressed',keys);}document.getElementById('keys').onclick=()=>{keys=!keys;setKeys()};
const note=document.getElementById('note');function meaning(e){const p=e.target.closest('.phrase');if(p&&getSelection().toString().length===0){note.querySelector('span').textContent=p.textContent+' = '+phrases[p.dataset.key];note.hidden=false;}}reading.addEventListener('click',meaning);reading.addEventListener('keydown',e=>{if(e.target.matches('.phrase')&&['Enter',' '].includes(e.key)){e.preventDefault();meaning(e);}});note.querySelector('button').onclick=()=>note.hidden=true;
function nodes(){const w=document.createTreeWalker(reading,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('.en')?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT});let a=[],n;while(n=w.nextNode())a.push(n);return a;}
function renderMarks(){if(!window.CSS?.highlights)return;const ns=nodes();for(const c of ['yellow','green','pink']){const rs=[];for(const m of marks.filter(x=>x.c===c)){const r=new Range();r.setStart(ns[m.n],m.a);r.setEnd(ns[m.n],m.b);rs.push(r);}CSS.highlights.set(c,new Highlight(...rs));}}
document.addEventListener('selectionchange',()=>{const s=getSelection();if(s.rangeCount&&!s.isCollapsed){const r=s.getRangeAt(0);if(reading.contains(r.commonAncestorContainer))selected=r.cloneRange();}});
reading.querySelectorAll('[data-action]').forEach(b=>{b.onpointerdown=e=>e.preventDefault();b.onclick=()=>{const action=b.dataset.action;if(action==='Undo'){if(undo.length){marks=undo.pop();renderMarks();}return;}if(action==='Clear colours'){undo.push(marks.map(x=>({...x})));marks=[];renderMarks();return;}if(!selected)return;undo.push(marks.map(x=>({...x})));nodes().forEach((n,ix)=>{if(!selected.intersectsNode(n))return;let a=n===selected.startContainer?selected.startOffset:0,b=n===selected.endContainer?selected.endOffset:n.length;if(a>=b)return;marks=marks.flatMap(m=>{if(m.n!==ix||m.b<=a||m.a>=b)return[m];let z=[];if(m.a<a)z.push({...m,b:a});if(m.b>b)z.push({...m,a:b});return z;});if(action!=='Erase')marks.push({n:ix,a,b,c:action.toLowerCase()});});renderMarks();getSelection().removeAllRanges();selected=null;};});
document.getElementById('reset').onclick=()=>{stop();audio.playbackRate=1;document.getElementById('speed').value='1';vi=false;keys=true;setVI();setKeys();marks=[];undo=[];selected=null;renderMarks();note.hidden=true;getSelection().removeAllRanges();};
</script></body></html>
